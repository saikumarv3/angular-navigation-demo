<div class="navigation-buttons">
  <button class="back-button" (click)="back.emit()">Back</button>
  <button class="next-button" (click)="next.emit()">Next</button>
  <button class="exit-button" (click)="onExit()">Exit</button>
</div>

<app-confirmation-dialog
  *ngIf="showExitDialog"
  (confirm)="onExitConfirmed()"
  (cancel)="onExitCancelled()">
</app-confirmation-dialog>
