<div class="page-container">
  <div class="page-content">
    <h1 class="page-title">{{title}}</h1>
    <div class="page-body">
      <ng-container *ngIf="currentPageData?.cards; else noCards">
        <div class="cards-container">
          <div *ngFor="let card of currentPageData!.cards" class="card">
            <h2 class="card-title">{{card.title}}</h2>
            <div class="questions-container">
              <div *ngFor="let question of card.questions" class="question">
                <p class="question-text">{{question.text}}</p>
                <div *ngIf="question.type === 'radio'" class="options-container">
                  <label *ngFor="let option of question.options" class="radio-option">
                    <input type="radio" 
                           [name]="question.id" 
                           [value]="option"
                           [(ngModel)]="answers[question.id]"
                           (blur)="onBlur.emit(question.id)">
                    {{option}}
                  </label>
                </div>
                <div *ngIf="question.type === 'checkbox'" class="options-container">
                  <label *ngFor="let option of question.options" class="checkbox-option">
                    <input type="checkbox" 
                           [name]="question.id" 
                           [value]="option"
                           [(ngModel)]="answers[question.id]"
                           (blur)="onBlur.emit(question.id)">
                    {{option}}
                  </label>
                </div>
                <div *ngIf="question.type === 'dropdown'" class="dropdown-container">
                  <select class="dropdown-select"
                          [(ngModel)]="answers[question.id]"
                          (blur)="onBlur.emit(question.id)">
                    <option value="">Select an option</option>
                    <option *ngFor="let option of question.options" [value]="option">
                      {{option}}
                    </option>
                  </select>
                </div>
                <div *ngIf="question.type === 'text'" class="text-input">
                  <input type="text" 
                         [(ngModel)]="answers[question.id]"
                         (blur)="onBlur.emit(question.id)">
                </div>
                <div *ngIf="showError(question)" class="error-message">
                  This field is required
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #noCards>
        <div class="no-cards-message">
          No form data available for this page.
        </div>
      </ng-template>
    </div>

  </div>
  <app-navigation-buttons
  [hasNext]="hasNext"
  [isFormValid]="isFormValid"
  (next)="next.emit()"
  (back)="back.emit()"
  (exit)="onExit()">
</app-navigation-buttons>
</div>
