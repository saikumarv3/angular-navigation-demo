<div class="page-container">

  <app-alert-bar 
    *ngIf="showLanError"
    [show]="true"
    [messages]="['LAN check failed. Please try again.']">
  </app-alert-bar>

  <app-alert-bar 
    *ngIf="crossOverMessages.length > 0"
    [show]="true"
    [messages]="crossOverMessages">
  </app-alert-bar>
  
  <app-page-content
    [title]="currentPageData?.title || ''"
    [currentPageData]="currentPageData"
    [answers]="answers"
    [hasNext]="hasNext"
    [isFormValid]="isFormValid"
    [validationErrors]="validationErrors"
    (next)="onNext()"
    (back)="onBack()"
    (blur)="onBlur($event)"
    (answerChange)="onAnswerChange($event)"
    (exit)="onExit()">
  </app-page-content>

  <div *ngIf="isCheckingLan" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p>Checking LAN status...</p>
  </div>
</div>
