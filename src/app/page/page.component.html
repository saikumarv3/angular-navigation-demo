<div class="page-container">
  <div class="page-content">
    <h2 class="page-title">{{title}}</h2>
    <div class="page-body">
      <!-- Add your page content here -->
      <p>This is the content for {{title}}</p>
    </div>
    <div class="page-actions">
      <button *ngIf="hasNext()" 
              class="next-button" 
              (click)="next()">
        Next
      </button>
    </div>
  </div>
</div>
