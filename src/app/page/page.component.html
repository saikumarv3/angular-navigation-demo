<div class="page-container">
  <app-contract-selector></app-contract-selector>
  <app-page-content
    [currentPageData]="currentPageData"
    [answers]="answers"
    [validationErrors]="validationErrors"
    [isFormValid]="isFormValid"
    [hasNext]="true"
    [hasAttemptedNext]="hasAttemptedNext"
    (answerChange)="handleAnswerChange($event)"
    (blur)="handleBlur($event)"
    (next)="handleNext()"
    (back)="handleBack()"
    (exit)="handleExit()"
  ></app-page-content>

  <div class="alert-container" *ngIf="crossOverMessages.length > 0">
    <app-alert-bar
      *ngFor="let message of crossOverMessages"
      [message]="message"
      type="warning"
    ></app-alert-bar>
  </div>
</div>
