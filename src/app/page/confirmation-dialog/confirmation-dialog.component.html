<div class="dialog-overlay">
  <div class="dialog-content">
    <h2>Are you sure?</h2>
    <p>Do you want to exit the questionnaire? All progress will be lost.</p>
    <div class="dialog-actions">
      <button class="cancel-button" (click)="onCancel()">No</button>
      <button class="confirm-button" (click)="onConfirm()">Yes</button>
    </div>
  </div>
</div>
