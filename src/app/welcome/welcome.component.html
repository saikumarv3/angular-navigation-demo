<div class="welcome-container">
  <div *ngIf="isLoading" class="loading-container">
    <div class="loading-spinner"></div>
    <p>Loading customer data...</p>
  </div>

  <app-alert-bar 
    *ngIf="showAlert"
    [show]="showAlert"
    [messages]="crossOverMessages">
  </app-alert-bar>

  <div *ngIf="!isLoading && customer" class="customer-container">
    <h1>Welcome, {{ customer.name }}</h1>
    
    <div class="button-group">
      <button (click)="startManualEntry()" class="manual-entry-btn">
        Start Manual Entry
      </button>
    </div>
    
    <div class="products-container">
      <h2>Your Products</h2>
      <table class="products-table">
        <thead>
          <tr>
            <th>Product Type</th>
            <th>State</th>
            <th>Last Renewal Date</th>
            <th>Next Renewal Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of products">
            <td>{{ product.type }}</td>
            <td>{{ product.state }}</td>
            <td>{{ product.lastRenewalDate }}</td>
            <td>{{ product.nextRenewalDate }}</td>
            <td>
              <button class="manage-btn" (click)="applySampleData(product)">Manage</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
